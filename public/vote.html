<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#120d2e">
<title>Ježíšek 404 — Vote</title>
<link rel="icon" href="/img/favicon.svg">
<style>
  :root { --gold: #f6c445; --red: #ff5d73; --cyan: #7ff3ff; --bg: #120d2e; --card: rgba(255,255,255,.08); --font: "Fredoka", "Nunito", "Trebuchet MS", "Segoe UI", system-ui, sans-serif; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; min-height: 100%; background: radial-gradient(ellipse at 50% 0%, #2c1f63, var(--bg) 60%); color: #fff; font-family: var(--font); }
  body { min-height: 100dvh; display: flex; flex-direction: column; align-items: center; padding: max(16px, env(safe-area-inset-top)) 16px max(20px, env(safe-area-inset-bottom)); }
  header { text-align: center; margin: 8px 0 18px; }
  header h1 { margin: 0; font-size: 34px; color: var(--gold); letter-spacing: 1px; text-shadow: 0 3px 0 #9a5a10; }
  header p { margin: 2px 0 0; opacity: .8; font-size: 16px; }
  main { width: 100%; max-width: 480px; flex: 1; display: flex; flex-direction: column; }
  .panel { background: var(--card); border: 2px solid rgba(255,255,255,.12); border-radius: 24px; padding: 22px; text-align: center; }
  .big { font-size: 26px; font-weight: 700; line-height: 1.25; margin: 6px 0 10px; }
  .muted { opacity: .8; font-size: 17px; line-height: 1.4; }
  .jolly { width: 120px; height: 120px; margin: 4px auto 10px; animation: float 3s ease-in-out infinite; }
  @keyframes float { 50% { transform: translateY(-10px); } }
  .tag { display: inline-block; background: var(--red); padding: 5px 16px; border-radius: 30px; font-weight: 800; letter-spacing: 2px; font-size: 14px; }
  .tag.live { animation: pulse 1s ease-in-out infinite; }
  @keyframes pulse { 50% { transform: scale(1.08); } }
  .q { font-size: 24px; font-weight: 800; margin: 14px 0 18px; line-height: 1.2; }
  .opt { display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; border: 3px solid rgba(255,255,255,.25); background: rgba(255,255,255,.06); color: #fff; border-radius: 22px; padding: 16px; margin-bottom: 14px; font: inherit; cursor: pointer; transition: transform .15s, border-color .2s, background .2s; min-height: 92px; }
  .opt:active { transform: scale(.97); }
  .opt .l { flex: 0 0 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; font-size: 26px; font-weight: 900; color: #111; }
  .opt.A .l { background: var(--gold); } .opt.B .l { background: var(--cyan); }
  .opt .ic { font-size: 34px; }
  .opt .t { font-size: 21px; font-weight: 800; line-height: 1.1; }
  .opt .s { font-size: 15px; opacity: .85; margin-top: 3px; }
  .opt.sel { border-color: var(--gold); background: rgba(246,196,69,.18); box-shadow: 0 0 30px rgba(246,196,69,.35); }
  .opt.sel::after { content: "✓"; margin-left: auto; font-size: 30px; color: var(--gold); font-weight: 900; }
  .opt[disabled] { opacity: .5; }
  .note { margin-top: 6px; font-size: 15px; opacity: .85; min-height: 22px; }
  .result .bar { height: 18px; border-radius: 9px; background: rgba(255,255,255,.15); overflow: hidden; margin: 6px 0 14px; }
  .result .fill { height: 100%; background: var(--gold); width: 0; transition: width 1.2s; }
  .result .row { text-align: left; font-weight: 700; font-size: 18px; display: flex; justify-content: space-between; }
  .result .win { color: var(--gold); }
  .count { font-size: 15px; opacity: .8; margin-top: 8px; }
  .wait { font-size: 56px; margin: 10px 0; animation: pulse 1.2s infinite; }
  #conn { position: fixed; top: 0; left: 0; right: 0; background: #b3213b; color: #fff; text-align: center; font-size: 14px; padding: 6px; display: none; z-index: 10; }
  footer { margin-top: 18px; font-size: 13px; opacity: .55; text-align: center; }
</style>
</head>
<body>
<div id="conn">Reconnecting… your vote is safe.</div>
<header><h1>JEŽÍŠEK 404</h1><p>Christmas Not Found · help save Christmas</p></header>
<main id="app"><div class="panel"><p class="muted">Connecting…</p></div></main>
<footer>Anonymous · no login · one vote per phone (you can change it while voting is open)</footer>
<script type="module" src="/js/vote.js"></script>
</body>
</html>
